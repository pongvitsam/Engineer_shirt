<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการขายเสื้อชมรมวิศวกร กฟภ.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://drive.google.com" crossorigin>
  <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://drive.google.com">
  <link rel="dns-prefetch" href="https://lh3.googleusercontent.com">

  <style>
    /* ── Critical first-paint CSS (no extra round-trip) ── */
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{font-family:'Sarabun','Segoe UI',sans-serif;color:#fff;min-height:100vh;background:linear-gradient(135deg,#450A0A 0%,#7F1D1D 25%,#4C1D95 55%,#6D28D9 80%,#991B1B 100%);background-size:400% 400%;overflow-x:hidden;display:flex;flex-direction:column}
    .pre-skel{padding:4.5rem 1rem 1rem;max-width:56rem;margin:0 auto}
    .pre-skel-card{height:8rem;background:rgba(255,255,255,.12);border-radius:1.25rem;margin-bottom:.875rem;animation:preskel 1.2s ease-in-out infinite;background-image:linear-gradient(90deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,.18) 50%,rgba(255,255,255,.08) 100%);background-size:200% 100%}
    .pre-skel-row{height:1.75rem;background:rgba(255,255,255,.1);border-radius:.5rem;margin-bottom:.5rem}
    @keyframes preskel{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .pre-header{position:fixed;top:0;left:0;right:0;height:3.25rem;background:rgba(69,10,10,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.28);display:flex;align-items:center;padding:0 1rem;font-weight:700;color:#fff;z-index:20}
    .pre-header i{color:#F59E0B;margin-right:.5rem}
    .pre-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-family:'Sarabun',sans-serif;z-index:30;background:rgba(20,5,10,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
    .pre-spinner{width:3rem;height:3rem;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:.75rem}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>

  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
  <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <?!= include("CSS"); ?>
</head>
<body>
  <!-- Pre-rendered header skeleton (visible before JS runs) -->
  <div id="pre-header" class="pre-header">
    <i class="fas fa-tshirt"></i><span>PEACE Eng Club</span>
  </div>

  <!-- Pre-rendered content skeleton (visible before JS runs) -->
  <div id="pre-skeleton" class="pre-skel">
    <div class="pre-skel-card"></div>
    <div class="pre-skel-card" style="height:6rem"></div>
    <div class="pre-skel-row"></div>
    <div class="pre-skel-row" style="width:80%"></div>
    <div class="pre-skel-row" style="width:60%"></div>
  </div>

  <header id="app-header" class="glass-header z-20 sticky top-0 hidden">
    <div class="header-top max-w-4xl mx-auto px-4 py-3 flex justify-between items-center gap-2">
      <div class="flex items-center gap-2 font-bold text-lg cursor-pointer glass-header-title" onclick="app.navigate('stock')">
        <i class="fas fa-tshirt"></i>
        <span>PEACE</span>
      </div>
      <div id="user-info-chip" class="hidden"></div>
      <div class="flex gap-1 text-xs flex-wrap justify-end" id="header-buttons">
        <button onclick="app.navigate('orders')" class="glass-btn px-2 py-1" title="บันทึกขาย" aria-label="บันทึกขาย"><i class="fas fa-plus"></i></button>
        <button onclick="app.navigate('list')" class="glass-btn px-2 py-1" title="รายการ" aria-label="รายการ"><i class="fas fa-list"></i></button>
        <button onclick="app.navigate('dashboard')" class="glass-btn px-2 py-1" title="แดชบอร์ด" aria-label="แดชบอร์ด"><i class="fas fa-chart-pie"></i></button>
        <button onclick="app.navigate('report')" class="glass-btn px-2 py-1" title="รายงาน" aria-label="รายงาน"><i class="fas fa-file-alt"></i></button>
        <button id="header-admin-btn" onclick="app.navigate('admin')" class="glass-btn-admin px-2 py-1 hidden" title="แอดมิน" aria-label="แอดมิน"><i class="fas fa-cog"></i></button>
      </div>
    </div>
    <nav class="max-w-4xl mx-auto px-4 pb-2 flex gap-1 overflow-x-auto text-xs" id="nav-tabs"></nav>
  </header>

  <main class="flex-grow pb-8">
    <div id="app-container" class="max-w-4xl mx-auto p-4"></div>
  </main>

  <?!= include("JavaScript"); ?>
</body>
</html>
