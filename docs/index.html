  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%237F1D1D'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='18' fill='%23F59E0B'%3EP%3C/text%3E%3C/svg%3E">

<body>

  <!-- Pre-rendered header skeleton (visible before JS runs) -->
  <div id="pre-header" class="pre-header">
    <i class="fas fa-tshirt"></i><span>PEACE Eng Club</span>
  </div>

  <!-- Pre-rendered content skeleton (visible before JS runs) -->
  <div id="pre-skeleton" class="pre-skel">
    <div class="pre-skel-card"></div>
    <div class="pre-skel-card" style="height:6rem"></div>
    <div class="pre-skel-row"></div>
    <div class="pre-skel-row" style="width:80%"></div>
    <div class="pre-skel-row" style="width:60%"></div>
  </div>

  <header id="app-header" class="glass-header z-20 sticky top-0 hidden">
    <div class="header-top max-w-4xl mx-auto px-4 py-3 flex justify-between items-center gap-2">
      <div class="flex items-center gap-2 font-bold text-lg cursor-pointer glass-header-title" onclick="app.navigate('stock')">
        <i class="fas fa-tshirt"></i>
        <span>PEACE</span>
      </div>
      <div id="user-info-chip" class="hidden"></div>
      <div class="flex gap-1 text-xs flex-wrap justify-end" id="header-buttons">
        <button onclick="app.navigate('orders')" class="glass-btn px-2 py-1" title="บันทึกขาย" aria-label="บันทึกขาย"><i class="fas fa-plus"></i></button>
        <button onclick="app.navigate('list')" class="glass-btn px-2 py-1" title="รายการขาย" aria-label="รายการขาย"><i class="fas fa-list"></i></button>
        <button onclick="app.navigate('dashboard')" class="glass-btn px-2 py-1" title="แดชบอร์ด" aria-label="แดชบอร์ด"><i class="fas fa-chart-pie"></i></button>
        <button onclick="app.navigate('report')" class="glass-btn px-2 py-1" title="รายงาน" aria-label="รายงาน"><i class="fas fa-file-alt"></i></button>
        <button id="header-admin-btn" onclick="app.navigate('admin')" class="glass-btn-admin px-2 py-1 hidden" title="แอดมิน" aria-label="แอดมิน"><i class="fas fa-cog"></i></button>
      </div>
    </div>
    <nav class="max-w-4xl mx-auto px-4 pb-2 flex gap-1 overflow-x-auto text-xs" id="nav-tabs"></nav>
  </header>

  <main class="flex-grow pb-8">
    <div id="app-container" class="max-w-4xl mx-auto p-4"></div>
  </main>

  <script>
    (function () {
      var DEFAULT_ADMIN_RE = /^(admin1|admin2)$/;
      var MOJIBAKE_RE = /(?:à¸|à¹|Ã)/;

      function decodeMojibakeText(value) {
        var s = String(value == null ? "" : value);
        if (!MOJIBAKE_RE.test(s)) return s;
        try { return decodeURIComponent(escape(s)); }
        catch (_) { return "System message unavailable"; }
      }

      function patchEscHtml() {
        if (typeof window.escHtml !== "function" || window.escHtml.__mojibakePatched__) return;
        var rawEscHtml = window.escHtml;
        var wrapped = function (value) {
          return rawEscHtml.call(this, decodeMojibakeText(value));
        };
        wrapped.__mojibakePatched__ = true;
        window.escHtml = wrapped;
      }

      function isValidSlipRef(ref) {
        var s = String(ref == null ? "" : ref).trim();
        if (!s) return false;
        if (/^drivefile:[a-zA-Z0-9_-]{20,}$/i.test(s)) return true;
        if (/^[a-zA-Z0-9_-]{20,}$/.test(s)) return true;
        if (/^https?:\/\/\S+/i.test(s)) return true;
        return false;
      }

      function normalizeOrderSlips() {
        if (!window.appData || !Array.isArray(window.appData.orders)) return;
        window.appData.orders.forEach(function (o) {
          if (!o || typeof o !== "object") return;
          if (!isValidSlipRef(o.slipUrl)) {
            o.slipUrl = "";
            o.slipName = "";
          }
        });
      }

      function ensureOrderNoteField() {
        if (document.getElementById("order-note")) return;
        var slipInput = document.getElementById("order-slip-file");
        if (!slipInput) return;
        var slipWrap = slipInput.closest("div");
        if (!slipWrap || !slipWrap.parentNode) return;
        var noteDiv = document.createElement("div");
        noteDiv.innerHTML =
          '<label class="glass-label">หมายเหตุ (ไม่บังคับ)</label>' +
          '<input id="order-note" type="text" class="glass-input text-sm" maxlength="120" placeholder="เช่น ชื่อผู้รับ, รายละเอียดเพิ่มเติม">';
        slipWrap.parentNode.insertBefore(noteDiv, slipWrap);
      }

      function normalizeMeAccess() {
        if (!window.me || typeof window.me !== "object") return;
        if (typeof window.normalizeMeClient_ === "function") {
          window.me = window.normalizeMeClient_(window.me);
          return;
        }
        var username = String(window.me.username || "").trim().toLowerCase();
        var roleRaw = String(window.me.role || "").trim();
        var role = roleRaw.toLowerCase();
        var region = String(window.me.region || "").trim();
        var regionNorm = region.toLowerCase();
        var regions = (window.appData && Array.isArray(window.appData.regions)) ? window.appData.regions : [];
        if (role === "*" && regionNorm === "admin" && DEFAULT_ADMIN_RE.test(username)) {
          window.me.role = "admin";
          window.me.region = "*";
          return;
        }
        if (regions.indexOf(roleRaw) > -1 && regionNorm === "user") {
          window.me.role = "user";
          window.me.region = roleRaw;
          return;
        }
        if (DEFAULT_ADMIN_RE.test(username) && role !== "admin") {
          window.me.role = "admin";
          if (!window.me.region || regionNorm === "admin") window.me.region = "*";
        }
      }

      function safeRerenderNav(reason) {
        try { normalizeMeAccess(); } catch (_) {}
        try { normalizeOrderSlips(); } catch (_) {}
        try { ensureOrderNoteField(); } catch (_) {}
        try { patchEscHtml(); } catch (_) {}
        try { if (typeof window.renderUserChip === "function") window.renderUserChip(); } catch (_) {}
        try { if (window.app && typeof window.app.renderNav === "function") window.app.renderNav(); } catch (_) {}
      }

      var rawIsAdmin = window.isAdmin;
      window.isAdmin = function () {
        try { normalizeMeAccess(); } catch (_) {}
        var username = window.me ? String(window.me.username || "").trim().toLowerCase() : "";
        if (DEFAULT_ADMIN_RE.test(username)) return true;
        if (typeof rawIsAdmin === "function" && rawIsAdmin !== window.isAdmin) {
          try { return !!rawIsAdmin(); } catch (_) {}
        }
        var role = window.me ? String(window.me.role || "").trim().toLowerCase() : "";
        return role === "admin";
      };

      var rawRenderUserChip = window.renderUserChip;
      if (typeof rawRenderUserChip === "function") {
        window.renderUserChip = function () {
          try { normalizeMeAccess(); } catch (_) {}
          return rawRenderUserChip.apply(this, arguments);
        };
      }

      function patchAppHooks() {
        if (!window.app || typeof window.app !== "object") return false;
        if (!window.app.__adminNavPatched__) {
          var rawRenderNav = window.app.renderNav;
          if (typeof rawRenderNav === "function") {
            window.app.renderNav = function () {
              try { normalizeMeAccess(); } catch (_) {}
              return rawRenderNav.apply(this, arguments);
            };
          }
          var rawNavigate = window.app.navigate;
          if (typeof rawNavigate === "function") {
            window.app.navigate = async function () {
              var out = await rawNavigate.apply(this, arguments);
              try { normalizeOrderSlips(); } catch (_) {}
              safeRerenderNav("navigate");
              return out;
            };
          }
          var rawUpsertRegionChart = window.app.upsertRegionChart;
          if (typeof rawUpsertRegionChart === "function") {
            window.app.upsertRegionChart = function (dash) {
              if (dash && Array.isArray(dash.regionLabels)) {
                dash = Object.assign({}, dash, {
                  regionLabels: dash.regionLabels.map(decodeMojibakeText)
                });
              }
              return rawUpsertRegionChart.call(this, dash);
            };
          }
          var rawViewOrderImage = window.app.viewOrderImage;
          if (typeof rawViewOrderImage === "function") {
            window.app.viewOrderImage = async function (orderId, btn) {
              var res = await rawViewOrderImage.call(this, orderId, btn);
              try {
                var orders = (window.appData && Array.isArray(window.appData.orders)) ? window.appData.orders : [];
                var groupHasInvalidSlip = orders.some(function (o) {
                  return String(o && o.orderId || "") === String(orderId || "") &&
                    String(o && o.slipUrl || "").trim() &&
                    !isValidSlipRef(o.slipUrl);
                });
                if (groupHasInvalidSlip && confirm("รูปแนบออเดอร์ไม่ถูกต้อง ต้องการเคลียร์รูปเพื่อแนบใหม่ทันทีหรือไม่?")) {
                  await window.callAuthed("deleteOrderImage", orderId);
                  normalizeOrderSlips();
                  if (typeof this.fillOrderListBody === "function") this.fillOrderListBody();
                  if (typeof this.showMsg === "function") this.showMsg("เคลียร์รูปแนบที่ไม่ถูกต้องแล้ว กรุณาแนบใหม่", "success");
                }
              } catch (_) {}
              return res;
            };
          }
          window.app.__adminNavPatched__ = true;
        }
        return true;
      }

      var rawDoLogin = window.doLogin;
      if (typeof rawDoLogin === "function") {
        window.doLogin = async function () {
          var out = await rawDoLogin.apply(this, arguments);
          safeRerenderNav("login");
          setTimeout(function () { safeRerenderNav("login-delay"); }, 900);
          return out;
        };
      }

      var rawBootEntry = window.bootEntry;
      if (typeof rawBootEntry === "function") {
        window.bootEntry = function () {
          var out = rawBootEntry.apply(this, arguments);
          patchAppHooks();
          setTimeout(function () { safeRerenderNav("boot"); }, 0);
          setTimeout(function () { safeRerenderNav("boot-delay"); }, 1200);
          return out;
        };
      }

      patchEscHtml();
      patchAppHooks();
      if (document.readyState === "complete") {
        setTimeout(function () { patchAppHooks(); safeRerenderNav("load-complete"); }, 500);
      } else {
        window.addEventListener("load", function () {
          setTimeout(function () { patchAppHooks(); safeRerenderNav("load"); }, 500);
        }, { once: true });
      }
    })();
  </script>

  <script src="config.js?v=107"></script>
  <script src="assets/app.js?v=107"></script>
</body>
