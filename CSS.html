<style>
  :root{
    --glass-bg:rgba(255,255,255,.18);
    --glass-bg-strong:rgba(255,255,255,.25);
    --glass-bg-subtle:rgba(255,255,255,.12);
    --glass-border:rgba(255,255,255,.28);
    --glass-border-soft:rgba(255,255,255,.15);
    --glass-shadow:0 8px 32px rgba(69,10,10,.18);
    --maroon:#7F1D1D;
    --pea:#6D28D9;
    --pea-light:#8B5CF6;
    --pea-gold:#F59E0B;

    /* Fluid typography */
    --fs-xs: clamp(.7rem, 1.6vw, .75rem);
    --fs-sm: clamp(.8rem, 2vw, .875rem);
    --fs-base: clamp(.875rem, 2.4vw, 1rem);
    --fs-lg: clamp(1rem, 2.8vw, 1.125rem);
    --fs-xl: clamp(1.05rem, 3.2vw, 1.25rem);
    --fs-2xl: clamp(1.25rem, 4vw, 1.5rem);
    --fs-stat: clamp(1.35rem, 4.6vw, 1.75rem);

    /* Touch target sizing */
    --touch-min: 44px;
    --touch-qty: 36px;
  }

  /* ── Reset & base ── */
  *{box-sizing:border-box}
  *,*::before,*::after{border-width:0;border-style:solid;border-color:currentColor}
  html,body{margin:0;padding:0}
  body{font-family:'Sarabun',sans-serif;color:#1f2937;min-height:100vh;background:linear-gradient(135deg,#450A0A 0%,#7F1D1D 25%,#4C1D95 55%,#6D28D9 80%,#991B1B 100%);background-size:400% 400%;animation:meshShift 18s ease infinite;position:relative;overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;display:flex;flex-direction:column;font-size:var(--fs-base)}
  @keyframes meshShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  body::before,body::after{content:'';position:fixed;border-radius:50%;filter:blur(80px);opacity:.45;pointer-events:none;z-index:0;will-change:transform;transform:translateZ(0)}
  body::before{width:420px;height:420px;background:radial-gradient(circle,rgba(139,92,246,.6) 0%,transparent 70%);top:-120px;right:-80px;animation:floatBlob 12s ease-in-out infinite}
  body::after{width:380px;height:380px;background:radial-gradient(circle,rgba(127,29,29,.55) 0%,transparent 70%);bottom:-100px;left:-60px;animation:floatBlob 15s ease-in-out infinite reverse}
  @keyframes floatBlob{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-20px) scale(1.08)}}
  header,main{position:relative;z-index:1}
  img{max-width:100%;height:auto;display:block}
  button{font-family:inherit;font-size:inherit;cursor:pointer;background:none;color:inherit}
  input,select,textarea{font-family:inherit}
  table{border-collapse:collapse;border-spacing:0}
  a{color:inherit;text-decoration:none}

  /* ── Layout utilities (Tailwind replacement) ── */
  .hidden{display:none !important}
  .block{display:block}
  .inline-block{display:inline-block}
  .flex{display:flex}
  .inline-flex{display:inline-flex}
  .grid{display:grid}
  .flex-col{flex-direction:column}
  .flex-wrap{flex-wrap:wrap}
  .flex-grow{flex-grow:1}
  .items-center{align-items:center}
  .items-start{align-items:flex-start}
  .justify-between{justify-content:space-between}
  .justify-center{justify-content:center}
  .gap-1{gap:.25rem}
  .gap-2{gap:.5rem}
  .gap-3{gap:.75rem}
  .gap-4{gap:1rem}
  .space-x-1>*+*{margin-left:.25rem}
  .space-x-2>*+*{margin-left:.5rem}
  .space-y-2>*+*{margin-top:.5rem}
  .space-y-3>*+*{margin-top:.75rem}
  .space-y-4>*+*{margin-top:1rem}

  .grid-cols-1{grid-template-columns:1fr}
  .grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .grid-cols-7{grid-template-columns:repeat(7,minmax(0,1fr))}
  .col-span-2{grid-column:span 2/span 2}

  .min-h-screen{min-height:100vh}
  .w-full{width:100%}
  .max-w-sm{max-width:24rem}
  .max-w-md{max-width:28rem}
  .max-w-4xl{max-width:56rem}
  .mx-auto{margin-left:auto;margin-right:auto}

  .max-h-40{max-height:10rem}
  .max-h-80{max-height:20rem}
  .h-10{height:2.5rem}
  .w-10{width:2.5rem}

  .p-2{padding:.5rem}
  .p-3{padding:.75rem}
  .p-4{padding:1rem}
  .p-5{padding:1.25rem}
  .px-1{padding-left:.25rem;padding-right:.25rem}
  .px-2{padding-left:.5rem;padding-right:.5rem}
  .px-3{padding-left:.75rem;padding-right:.75rem}
  .px-4{padding-left:1rem;padding-right:1rem}
  .px-5{padding-left:1.25rem;padding-right:1.25rem}
  .py-1{padding-top:.25rem;padding-bottom:.25rem}
  .py-1\.5{padding-top:.375rem;padding-bottom:.375rem}
  .py-2{padding-top:.5rem;padding-bottom:.5rem}
  .py-3{padding-top:.75rem;padding-bottom:.75rem}
  .py-8{padding-top:2rem;padding-bottom:2rem}
  .pb-2{padding-bottom:.5rem}
  .pb-8{padding-bottom:2rem}
  .pt-3{padding-top:.75rem}

  .mt-1{margin-top:.25rem}
  .mt-2{margin-top:.5rem}
  .mt-3{margin-top:.75rem}
  .mt-4{margin-top:1rem}
  .mb-2{margin-bottom:.5rem}
  .mb-3{margin-bottom:.75rem}
  .mb-4{margin-bottom:1rem}
  .mr-1{margin-right:.25rem}
  .mr-2{margin-right:.5rem}
  .ml-1{margin-left:.25rem}

  .text-xs{font-size:var(--fs-xs);line-height:1.1rem}
  .text-sm{font-size:var(--fs-sm);line-height:1.25rem}
  .text-base{font-size:var(--fs-base);line-height:1.5rem}
  .text-lg{font-size:var(--fs-lg);line-height:1.6rem}
  .text-xl{font-size:var(--fs-xl);line-height:1.75rem}
  .text-2xl{font-size:var(--fs-2xl);line-height:2rem}
  .text-6xl{font-size:clamp(2.5rem, 10vw, 3.75rem);line-height:1}

  .font-bold{font-weight:700}
  .font-semibold{font-weight:600}
  .text-center{text-align:center}
  .text-right{text-align:right}
  .text-left{text-align:left}
  .whitespace-nowrap{white-space:nowrap}
  .uppercase{text-transform:uppercase}

  .rounded-lg{border-radius:.5rem}
  .rounded-xl{border-radius:.75rem}
  .rounded-full{border-radius:9999px}

  .overflow-hidden{overflow:hidden}
  .overflow-x-auto{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .relative{position:relative}
  .absolute{position:absolute}
  .sticky{position:sticky}
  .top-0{top:0}
  .top-2{top:.5rem}
  .right-2{right:.5rem}
  .z-10{z-index:10}
  .z-20{z-index:20}
  .z-50{z-index:50}

  .opacity-70{opacity:.7}
  .opacity-80{opacity:.8}
  .opacity-90{opacity:.9}
  .cursor-pointer{cursor:pointer}
  .cursor-zoom-in{cursor:zoom-in}

  .object-contain{object-fit:contain}
  .object-cover{object-fit:cover}

  .border-b{border-bottom-width:1px}

  /* ── Responsive utility classes (CSS media query equivalents) ── */
  /* sm: ≥640px */
  @media (min-width:640px){
    .sm\:inline{display:inline}
    .sm\:inline-block{display:inline-block}
    .sm\:block{display:block}
    .sm\:flex{display:flex}
    .sm\:hidden{display:none !important}
    .sm\:grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .sm\:grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .sm\:grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .sm\:flex-row{flex-direction:row}
  }
  /* md: ≥768px */
  @media (min-width:768px){
    .md\:grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .md\:grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .md\:grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .md\:grid-cols-7{grid-template-columns:repeat(7,minmax(0,1fr))}
    .md\:hidden{display:none !important}
    .md\:block{display:block}
    .md\:inline{display:inline}
    .md\:flex{display:flex}
  }
  /* lg: ≥1024px */
  @media (min-width:1024px){
    .lg\:grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .lg\:grid-cols-7{grid-template-columns:repeat(7,minmax(0,1fr))}
  }
  /* xs: <480px (mobile portrait) */
  @media (max-width:479.98px){
    .xs\:hidden{display:none !important}
  }

  /* ── Glass header ── */
  .glass-header{background:rgba(69,10,10,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);box-shadow:0 4px 24px rgba(0,0,0,.15)}
  .glass-header-title{color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.2)}
  .glass-header-title i{color:var(--pea-gold)}

  /* ── Glass cards (only TOP-level uses backdrop-filter for speed) ── */
  .glass-card{background:var(--glass-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:1.25rem;box-shadow:var(--glass-shadow);overflow:hidden;contain:layout style}
  .glass-card-inner{background:var(--glass-bg-subtle);border:1px solid var(--glass-border-soft);border-radius:1rem}
  .glass-card-header{background:rgba(127,29,29,.7);border-bottom:1px solid var(--glass-border-soft);color:#fff}
  .glass-section-title{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.15)}
  .glass-section-title i{color:#FCA5A5}
  .glass-divider{border-color:var(--glass-border-soft)}

  /* ── Buttons ── */
  .glass-btn{background:rgba(255,255,255,.18);border:1px solid var(--glass-border);border-radius:.75rem;color:#fff;transition:background .2s ease,transform .15s ease;cursor:pointer;padding:.5rem .75rem;font-size:var(--fs-sm);min-height:var(--touch-min);min-width:var(--touch-min);display:inline-flex;align-items:center;justify-content:center;gap:.25rem}
  .glass-btn:hover{background:rgba(255,255,255,.3)}

  .glass-btn-primary{background:rgba(127,29,29,.8);border:1px solid rgba(255,255,255,.25);border-radius:.875rem;color:#fff;font-weight:700;box-shadow:0 4px 20px rgba(127,29,29,.35);transition:background .2s ease,transform .15s ease;cursor:pointer;padding:.625rem 1rem;font-size:var(--fs-sm);min-height:var(--touch-min);display:inline-flex;align-items:center;justify-content:center;gap:.35rem}
  .glass-btn-primary:hover{background:rgba(69,10,10,.9);transform:translateY(-1px)}

  .glass-btn-secondary{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);border-radius:.875rem;color:#fff;font-weight:700;transition:background .2s ease,transform .15s ease;cursor:pointer;padding:.625rem 1rem;font-size:var(--fs-sm);min-height:var(--touch-min);display:inline-flex;align-items:center;justify-content:center;gap:.35rem}
  .glass-btn-secondary:hover{background:rgba(255,255,255,.32);transform:translateY(-1px)}

  .glass-btn-danger{background:rgba(220,38,38,.7);border:1px solid rgba(255,255,255,.2);border-radius:.75rem;color:#fff;cursor:pointer;padding:.5rem 1rem;transition:background .2s ease;min-height:var(--touch-min);display:inline-flex;align-items:center;justify-content:center;gap:.25rem}
  .glass-btn-danger:hover{background:rgba(185,28,28,.85)}

  .glass-btn-admin{background:rgba(185,28,28,.55);border:1px solid rgba(255,255,255,.2);border-radius:.75rem;color:#fff;cursor:pointer;padding:.5rem .75rem;min-height:var(--touch-min);min-width:var(--touch-min);display:inline-flex;align-items:center;justify-content:center}
  .glass-btn-admin:hover{background:rgba(153,27,27,.75)}

  .glass-btn-pea{background:rgba(109,40,217,.7);border:1px solid rgba(255,255,255,.25);border-radius:.75rem;color:#fff;font-weight:700;cursor:pointer;padding:.625rem 1rem;transition:background .2s ease;min-height:var(--touch-min);display:inline-flex;align-items:center;justify-content:center;gap:.35rem}
  .glass-btn-pea:hover{background:rgba(76,29,149,.85)}

  .glass-btn-blue{background:rgba(37,99,235,.7);border:1px solid rgba(255,255,255,.25);border-radius:.75rem;color:#fff;font-weight:700;cursor:pointer;padding:.625rem 1rem;transition:background .2s ease;min-height:var(--touch-min);display:inline-flex;align-items:center;justify-content:center;gap:.35rem}
  .glass-btn-blue:hover{background:rgba(29,78,216,.85)}

  /* ── Inputs ── */
  .glass-input,.glass-select{width:100%;background:rgba(255,255,255,.15);border:1px solid var(--glass-border);border-radius:.75rem;padding:.75rem;color:#fff;transition:border-color .2s ease,background .2s ease;outline:none;font-size:var(--fs-sm);min-height:var(--touch-min)}
  .glass-input::placeholder{color:rgba(255,255,255,.5)}
  .glass-input:focus,.glass-select:focus{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.45);box-shadow:0 0 0 3px rgba(139,92,246,.25)}
  .glass-input-readonly{background:rgba(139,92,246,.2);font-weight:700}
  .glass-select option{background:#4C1D95;color:#fff}
  .glass-label{display:block;font-size:var(--fs-sm);font-weight:700;color:rgba(255,255,255,.9);margin-bottom:.25rem}

  /* ── Tables ── */
  .glass-table-wrap{background:rgba(255,255,255,.08);border:1px solid var(--glass-border-soft);border-radius:.875rem;overflow:hidden}
  .responsive-table{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .stock-table th,.stock-table td,.report-table th,.report-table td,.glass-table th,.glass-table td{border:1px solid rgba(255,255,255,.12);padding:.5rem .25rem;color:rgba(255,255,255,.92)}
  .stock-table th,.report-table th,.glass-table th{background:rgba(255,255,255,.12);font-size:var(--fs-xs);font-weight:700}
  .stock-table td,.report-table td,.glass-table td{font-size:var(--fs-sm)}
  .glass-table tbody tr:hover,.stock-table tbody tr:hover{background:rgba(255,255,255,.08)}
  .stock-cell{min-width:3.5rem;text-align:center}
  .glass-table tfoot{background:rgba(127,29,29,.25);font-weight:700}

  /* ── Size badges ── */
  .size-badge{display:inline-block;min-width:2.5rem;text-align:center;font-weight:700;padding:.25rem .5rem;border-radius:.5rem;font-size:var(--fs-xs);border:1px solid rgba(255,255,255,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
  .size-XS{background:rgba(224,242,254,.8);color:#0369A1}
  .size-S{background:rgba(204,251,241,.8);color:#0F766E}
  .size-M{background:rgba(219,234,254,.8);color:#1D4ED8}
  .size-L{background:rgba(254,226,226,.8);color:#B91C1C}
  .size-XL{background:rgba(255,237,213,.8);color:#C2410C}
  .size-2L{background:rgba(254,243,199,.8);color:#B45309}
  .size-3L{background:rgba(209,250,229,.8);color:#047857}
  .size-5L{background:rgba(237,233,254,.8);color:#6D28D9}
  .size-7L{background:rgba(252,231,243,.8);color:#BE185D}

  /* ── Stat cards ── */
  .glass-stat{background:rgba(255,255,255,.15);border:1px solid var(--glass-border);border-radius:1rem;padding:1rem;box-shadow:0 4px 16px rgba(0,0,0,.08);color:#fff}
  .glass-stat-label{font-size:var(--fs-xs);font-weight:700;opacity:.85}
  .glass-stat-value{font-size:var(--fs-stat);font-weight:700;line-height:1.1}
  .glass-stat-sub{font-size:var(--fs-xs);opacity:.65}
  .glass-stat-purple{border-color:rgba(139,92,246,.4);background:rgba(139,92,246,.2)}
  .glass-stat-orange{border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.18)}
  .glass-stat-blue{border-color:rgba(59,130,246,.4);background:rgba(59,130,246,.18)}
  .glass-stat-yellow{border-color:rgba(234,179,8,.4);background:rgba(234,179,8,.18)}
  .glass-stat-green{border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.18)}

  /* Responsive stat grid */
  .stats-grid{display:grid;grid-template-columns:1fr;gap:.75rem}
  @media (min-width:481px){.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (min-width:1024px){.stats-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

  /* ── Stock mini cards ── */
  .glass-stock-cell{text-align:center;padding:.75rem;background:rgba(255,255,255,.12);border:1px solid var(--glass-border-soft);border-radius:.75rem;color:#fff}
  .glass-stock-cell.low{background:rgba(239,68,68,.2);border-color:rgba(239,68,68,.35)}

  /* ── Stock mobile cards (per-size cards under 640px) ── */
  .stock-mobile-grid{display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
  .stock-mobile-card{background:rgba(255,255,255,.12);border:1px solid var(--glass-border-soft);border-radius:.875rem;padding:.75rem;color:#fff}
  .stock-mobile-card.low{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.35)}
  .stock-mobile-card .row{display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-xs);margin-top:.25rem}
  .stock-mobile-card .row .lbl{opacity:.7}
  .stock-mobile-card .row .val{font-weight:700}

  /* ── Chart containers ── */
  .glass-chart-box{background:rgba(255,255,255,.12);border:1px solid var(--glass-border-soft);border-radius:.875rem;padding:.65rem;height:17rem}
  @media (min-width:1024px){.glass-chart-box{height:21rem}}

  /* ── Nav tabs ── */
  .nav-tab{white-space:nowrap;padding:.45rem .85rem;border-radius:9999px;cursor:pointer;transition:background .15s ease,color .15s ease;border:1px solid transparent;font-size:var(--fs-xs);color:rgba(255,255,255,.75);background:transparent;min-height:36px;display:inline-flex;align-items:center;gap:.25rem}
  .nav-tab.active{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.35);color:#fff;font-weight:700}
  .nav-tab:not(.active):hover{background:rgba(255,255,255,.1);color:#fff}

  /* ── Status colors ── */
  .status-รับแล้ว{background:rgba(34,197,94,.25);color:#86EFAC;border:1px solid rgba(34,197,94,.35)}
  .status-รอโอน{background:rgba(59,130,246,.25);color:#93C5FD;border:1px solid rgba(59,130,246,.35)}
  .status-รอรับ{background:rgba(234,179,8,.25);color:#FDE047;border:1px solid rgba(234,179,8,.35)}

  /* ── Custom glass dropdown (replaces native <select> on order form/list to avoid native popover overlap) ── */
  .glass-dd{position:relative;width:100%}
  .glass-dd-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:.5rem;background:rgba(255,255,255,.15);border:1px solid var(--glass-border);border-radius:.75rem;padding:.75rem;color:#fff;font-size:var(--fs-sm);min-height:var(--touch-min);cursor:pointer;text-align:left;outline:none;transition:border-color .2s ease,background .2s ease}
  .glass-dd-toggle:hover{background:rgba(255,255,255,.22)}
  .glass-dd-toggle:focus-visible{border-color:rgba(255,255,255,.45);box-shadow:0 0 0 3px rgba(139,92,246,.25)}
  .glass-dd-label{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .glass-dd-caret{font-size:.8em;opacity:.85;flex-shrink:0;transition:transform .2s ease}
  .glass-dd.is-open .glass-dd-caret{transform:rotate(180deg)}
  .glass-dd-compact .glass-dd-toggle{padding:.35rem .5rem;font-size:var(--fs-xs);min-height:36px;border-radius:.6rem}
  .glass-dd.status-รับแล้ว .glass-dd-toggle{background:rgba(34,197,94,.22);border-color:rgba(34,197,94,.4);color:#86EFAC}
  .glass-dd.status-รอโอน .glass-dd-toggle{background:rgba(59,130,246,.22);border-color:rgba(59,130,246,.4);color:#93C5FD}
  .glass-dd.status-รอรับ .glass-dd-toggle{background:rgba(234,179,8,.22);border-color:rgba(234,179,8,.4);color:#FDE047}
  .glass-dd-floating{position:fixed;z-index:1200;min-width:160px;max-height:60vh;overflow-y:auto;background:rgba(46,16,40,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:.85rem;box-shadow:0 18px 48px rgba(0,0,0,.5);padding:.35rem}
  .glass-dd-option{width:100%;display:flex;align-items:center;justify-content:space-between;gap:.5rem;background:transparent;border:0;border-radius:.6rem;padding:.6rem .7rem;color:#fff;font-size:var(--fs-sm);cursor:pointer;text-align:left;min-height:42px}
  .glass-dd-option:hover,.glass-dd-option:focus-visible{background:rgba(255,255,255,.16);outline:none}
  .glass-dd-option.is-active{background:rgba(139,92,246,.35);font-weight:700}
  .glass-dd-option i{font-size:.85em;opacity:.9;flex-shrink:0}

  /* ── Danger zone ── */
  .glass-danger-zone{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.35);border-radius:1rem;padding:1rem;color:#FCA5A5}

  /* ── Messages ── */
  .glass-msg-success{background:rgba(34,197,94,.2);border:1px solid rgba(34,197,94,.35);color:#86EFAC;border-radius:.875rem;padding:.75rem}
  .glass-msg-error{background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.35);color:#FCA5A5;border-radius:.875rem;padding:.75rem}

  /* ── Skeleton ── */
  .skeleton-wrap{min-height:12rem}
  .skeleton{border-radius:.875rem;background:linear-gradient(90deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,.18) 50%,rgba(255,255,255,.08) 100%);background-size:200% 100%;animation:skeletonShimmer 1.2s ease-in-out infinite;will-change:background-position}
  .skeleton-card{height:8rem}
  .skeleton-table{height:6rem}
  .skeleton-stat{height:4.5rem}
  .skeleton-chart{height:13rem}
  @keyframes skeletonShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* ── Saving / loading indicators ── */
  @keyframes spin360{to{transform:rotate(360deg)}}
  .btn-spinner{width:1em;height:1em;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;display:inline-block;animation:spin360 .6s linear infinite;flex-shrink:0;vertical-align:-.15em}
  .glass-btn-primary.is-loading,.glass-btn-secondary.is-loading,.glass-btn-danger.is-loading,.glass-btn-blue.is-loading,.glass-btn-pea.is-loading,.glass-btn.is-loading{opacity:.85;cursor:progress}
  button:disabled{cursor:not-allowed}
  button.is-loading{pointer-events:none}
  /* Floating glass "saving…" toast */
  .glass-busy{position:fixed;left:50%;bottom:1.25rem;transform:translateX(-50%) translateY(1.5rem);z-index:9998;display:flex;align-items:center;gap:.6rem;background:rgba(46,16,40,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:9999px;box-shadow:0 12px 40px rgba(0,0,0,.4);color:#fff;padding:.6rem 1.1rem;font-size:var(--fs-sm);font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;max-width:calc(100vw - 1.5rem)}
  .glass-busy.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .glass-busy-spinner{width:1.1rem;height:1.1rem;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#FCD34D;display:inline-block;animation:spin360 .6s linear infinite;flex-shrink:0}
  .glass-busy-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (prefers-reduced-motion: reduce){.btn-spinner,.glass-busy-spinner{animation-duration:1.2s}}
  @media (max-width:480px){.glass-busy{bottom:.85rem;padding:.5rem .9rem}}

  /* ── Text colors ── */
  .text-glass{color:rgba(255,255,255,.92)}
  .text-glass-muted{color:rgba(255,255,255,.6)}
  .text-glass-dim{color:rgba(255,255,255,.45)}
  .text-orange-glass{color:#FDBA74}
  .text-green-glass{color:#86EFAC}
  .text-red-glass{color:#FCA5A5}

  .glass-row-remain{background:rgba(34,197,94,.12) !important}
  .glass-image-wrap{background:rgba(255,255,255,.08);border:1px solid var(--glass-border-soft);border-radius:.875rem}
  .glass-total-bar{background:rgba(34,197,94,.18);border:1px solid rgba(34,197,94,.3);border-radius:.75rem;padding:.5rem;color:#86EFAC;font-weight:700;text-align:center}

  /* ── Animations ── */
  .fade-in{animation:fadeIn .25s ease-out;will-change:opacity,transform}
  @keyframes fadeIn{from{opacity:0;transform:translate3d(0,8px,0)}to{opacity:1;transform:translate3d(0,0,0)}}

  /* ── Login screen ── */
  .login-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(20,5,10,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .login-card{background:rgba(76,29,149,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.3);border-radius:1.25rem;box-shadow:0 24px 60px rgba(0,0,0,.45);color:#fff;width:100%;max-width:24rem;padding:1.25rem}
  .login-title{font-size:var(--fs-xl);font-weight:700;text-align:center;margin-bottom:.25rem}
  .login-sub{font-size:var(--fs-xs);text-align:center;opacity:.8;margin-bottom:1rem}
  @media (min-width:768px){
    .login-card{max-width:28rem;padding:1.75rem}
  }

  /* ── Multi-size order table ── */
  .order-size-table{width:100%;border-collapse:collapse;color:#fff}
  .order-size-table th{background:rgba(255,255,255,.12);font-size:var(--fs-xs);padding:.5rem;text-align:center;border:1px solid rgba(255,255,255,.12)}
  .order-size-table td{padding:.5rem .25rem;text-align:center;border:1px solid rgba(255,255,255,.12);font-size:var(--fs-sm)}
  .qty-btn{width:var(--touch-qty);height:var(--touch-qty);border-radius:9999px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;font-weight:700;cursor:pointer;font-size:1.1rem;line-height:1;display:inline-flex;align-items:center;justify-content:center;touch-action:manipulation}
  .qty-btn:hover{background:rgba(255,255,255,.32)}
  .qty-btn:disabled{opacity:.3;cursor:not-allowed}
  .qty-value{display:inline-block;min-width:2.25rem;font-weight:700;font-size:1rem;padding:0 .25rem}
  /* Submit bar: keep below form controls in stacking order + clear spacing so it never overlaps the status select */
  .submit-bar{position:relative;z-index:1;margin-top:1.25rem;padding-top:.5rem}

  /* ── User chip in header ── */
  .user-chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:9999px;padding:.25rem .75rem;color:#fff;font-size:var(--fs-xs);display:inline-flex;align-items:center;gap:.35rem;max-width:100%;overflow:hidden}
  .user-chip > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .role-badge-admin{background:rgba(245,158,11,.28);color:#FCD34D;border:1px solid rgba(245,158,11,.45);padding:.05rem .4rem;border-radius:9999px;font-size:.65rem;font-weight:700;flex-shrink:0}
  .role-badge-user{background:rgba(59,130,246,.28);color:#BFDBFE;border:1px solid rgba(59,130,246,.45);padding:.05rem .4rem;border-radius:9999px;font-size:.65rem;font-weight:700;flex-shrink:0}
  .role-badge-guest{background:rgba(16,185,129,.28);color:#A7F3D0;border:1px solid rgba(16,185,129,.45);padding:.05rem .4rem;border-radius:9999px;font-size:.65rem;font-weight:700;flex-shrink:0}
  .chip-name{flex-shrink:1;min-width:0}
  .chip-region{opacity:.75;flex-shrink:1;min-width:0}
  .chip-logout{margin-left:.25rem;background:transparent;border:0;color:#fff;cursor:pointer;min-width:32px;min-height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:9999px;flex-shrink:0}
  .chip-logout:hover{background:rgba(255,255,255,.15)}

  /* ── Reduced motion ── */
  @media (prefers-reduced-motion: reduce){
    body{animation:none}
    body::before,body::after{animation:none}
    .fade-in,.skeleton{animation:none}
    .skeleton{background:rgba(255,255,255,.12)}
  }

  @supports not (backdrop-filter:blur(1px)){
    .glass-card,.glass-header,.glass-btn,.glass-input,.glass-stat{background:rgba(69,10,10,.92)}
  }

  /* =================================================================
     ── RESPONSIVE BREAKPOINTS ──
     xs: ≤480px (mobile portrait)
     sm: 481–640px (mobile landscape / small)
     md: 641–768px (small tablet)
     tablet: 769–1024px
     desktop: ≥1025px
     ================================================================= */

  /* ── App container padding scales ── */
  @media (max-width:480px){
    main > #app-container{padding-left:.75rem !important;padding-right:.75rem !important;padding-top:.75rem !important}
    .glass-header > div, .glass-header > nav{padding-left:.75rem !important;padding-right:.75rem !important}
    .glass-card.p-5{padding:1rem !important}
    .glass-card.p-4{padding:.85rem !important}
    .glass-card-header.px-5{padding-left:1rem !important;padding-right:1rem !important}
    main{padding-bottom:1.5rem !important}
  }

  /* ── Header responsive ── */
  @media (max-width:768px){
    .glass-header > .header-top{padding-top:.5rem;padding-bottom:.5rem;flex-wrap:wrap;gap:.5rem}
    .glass-header-title span{display:none}

  }
  @media (min-width:769px){
    .glass-header-title span{display:inline}

  @media (max-width:640px){

  }
  @media (max-width:480px){

  /* Header buttons icon-only on mobile; shrink padding */
  @media (max-width:640px){

    #header-buttons .glass-btn,
    #header-buttons .glass-btn-admin{padding:.35rem .5rem;min-width:38px;min-height:38px;border-radius:.5rem}
  }

  /* ── Login screen responsive ── */
  @media (max-width:480px){
    .login-card{max-width:22rem;padding:1rem}
    .login-overlay{padding:.75rem}
    .login-title{font-size:1.125rem}

  /* ── Stock table: hide on mobile, show mobile cards ── */
  @media (max-width:640px){

  }
  @media (max-width:380px){
    .stock-mobile-grid{grid-template-columns:1fr}
  }

  /* ── Shirt image responsive ── */
  @media (max-width:640px){

  /* ── Order form: size table → cards on mobile ── */
  @media (max-width:640px){

    .order-size-table tfoot tr{display:grid !important;grid-template-columns:1fr 1fr;gap:.25rem;padding:.75rem;background:rgba(127,29,29,.4) !important;border-radius:.75rem;margin-top:.5rem}
    .order-size-table tfoot td{border:0 !important;padding:.25rem !important;text-align:left !important}
    .order-size-table tfoot td[colspan]{grid-column:1 / -1;text-align:center !important;font-size:var(--fs-sm)}

      display:grid !important;

    .order-size-table tbody tr td:nth-child(4)::before{content:"";display:none}
    .qty-btn{width:42px;height:42px;font-size:1.25rem}
  }

  /* Tablet+: keep table compact */
  @media (min-width:641px) and (max-width:768px){
    .order-size-table th, .order-size-table td{padding:.4rem .25rem;font-size:var(--fs-sm)}
  }

  /* Sticky submit on mobile order form */
  @media (max-width:640px){
    .submit-bar{position:sticky;bottom:0;z-index:5;margin-top:1.25rem;padding-top:.85rem;padding-bottom:.6rem;background:rgba(20,5,10,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--glass-border-soft)}
  }

  /* ── Order list: convert table to cards <640px ── */
  @media (max-width:640px){
    #order-table{font-size:var(--fs-sm)}
    #order-table, #order-table thead, #order-table tbody, #order-table tr, #order-table td{display:block;width:100%}
    #order-table thead{display:none}
    #order-table tr{
      background:rgba(255,255,255,.08);

  /* Tablet+ keeps table but with sticky first column (order ID) */
  @media (min-width:641px) and (max-width:1024px){

  #dash-cards{display:grid;gap:.75rem;grid-template-columns:1fr}

  #report-cards{display:grid;gap:.75rem;grid-template-columns:1fr}

  @media (min-width:768px){#report-cards{grid-template-columns:repeat(4,minmax(0,1fr))}}

  /* ── Report region table → cards on mobile ── */
  @media (max-width:640px){

  /* ── Admin user list rows: stack on narrow ── */
  @media (max-width:380px){

    #admin-users-list .glass-card-inner > div:last-child{justify-content:flex-end}

  /* ── Status select sized for tap ── */
  @media (max-width:640px){

  }

  /* ── Headings scale ── */

  h2, .h2{font-size:var(--fs-xl)}

  .image-lightbox-overlay{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:1.25rem;background:rgba(20,5,10,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
