<script>
(function(){
  function pickImg(r){
    if(!r)return "";
    if(r.imageDataThumb&&String(r.imageDataThumb).indexOf("data:")===0)return r.imageDataThumb;
    var ref=String(r.imageUrl||r.imageRef||"").trim();
    var m=ref.match(/[-\w]{25,}/);
    if(m)return "https://drive.google.com/thumbnail?id="+encodeURIComponent(m[0])+"&sz=w1920";
    return "";
  }
  try{
    var raw=sessionStorage.getItem("peace_login_preview_v1");
    if(!raw)return;
    var data=JSON.parse(raw);
    var r=data&&data.round;
    if(!r)return;
    var y=document.getElementById("login-hero-year");
    var cap=document.getElementById("login-hero-caption");
    var price=document.getElementById("login-hero-price");
    var img=document.getElementById("login-hero-img");
    if(y)y.textContent=r.year||"—";
    if(cap&&r.name)cap.textContent=String(r.name);
    if(price){
      var p=Number(r.unitPrice||0);
      price.textContent=p>0?(p+" ฿"):"";
      price.style.display=p>0?"":"none";
    }
    var src=pickImg(r);
    if(img&&src){img.src=src;img.classList.remove("hidden");}
  }catch(e){}
})();
</script>
